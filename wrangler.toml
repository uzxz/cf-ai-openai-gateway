name = "cf-ai-openai-gateway"
main = "src/worker.js"
compatibility_date = "2026-11-09"
compatibility_flags = ["nodejs_compat"]

# 本地开发：把凭据写进 .dev.vars（已加入 .gitignore）。
# 一键部署 / 生产：secrets 由 .dev.vars.example 声明，
#   Cloudflare 在部署引导页提示填写，或手动 `wrangler secret put`。
# 源码与配置文件里不放任何凭据。
# 需要的 secrets：GATEWAY_KEY / CF_AI_TOKEN / CF_ACCOUNT_ID
# 可选变量（非敏感，见下方 [vars]）：MAX_TOKENS_CAP / MAX_TOKENS_DEFAULT

[vars]
# 非敏感的默认参数；敏感值一律走 secret / .dev.vars.example
MAX_TOKENS_CAP = "512"
MAX_TOKENS_DEFAULT = "256"
# 设为 "false" 可关闭用量埋点（工作台查询仍可用）
METRICS_ENABLED = "true"

# ---------------------------------------------------------------------------
# 监控统计（默认关闭，需要时手动启用）
#
# 为什么默认注释掉：Analytics Engine 需要在账户里**先手动启用**，
# 否则部署带该 binding 的 Worker 会直接失败：
#   "You need to enable Analytics Engine."
# 为保证首次部署 / 一键部署 / 自动构建 100% 成功，这里默认不声明 binding。
# 不声明时网关推理功能完全正常，仅 /dashboard 显示「监控未启用」。
#
# 启用步骤（三步）：
#   1. 打开 https://dash.cloudflare.com/<你的账户 ID>/workers/analytics-engine
#      点击启用（Free 计划含 100,000 写入/天 + 10,000 查询/天，当前不计费）
#   2. 取消下面两段配置的注释
#   3. 重新部署（push 后 Workers Builds 会自动部署，或 npm run deploy）
#
# 数据集不需要预创建资源 ID；表在首次写入时自动创建。
# 保持 Workers Free 计划不升级，即不会产生账单。
# ---------------------------------------------------------------------------

# [[analytics_engine_datasets]]
# binding = "AOG_METRICS"
# dataset = "cf_aog_metrics"

# [analytics]
# binding = "ANALYTICS_SQL"

[observability]
enabled = true
